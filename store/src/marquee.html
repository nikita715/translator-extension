<!DOCTYPE html><meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; }
  body {
    position: relative;
    background: #1a73e8;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .brand { position: absolute; left: 88px; top: 72px; display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; }
  .brand img { width: 52px; height: 52px; border-radius: 12px; }
  .text { position: absolute; left: 88px; top: 176px; width: 520px; }
  h1 { margin: 0; font-size: 60px; line-height: 1.08; font-weight: 700; letter-spacing: -0.025em; }
  .sub { width: 470px; margin: 28px 0 0; font-size: 22px; line-height: 1.45; opacity: 0.88; }

  .page {
    position: absolute; left: 690px; top: 64px; width: 760px; height: 560px; padding: 44px 48px;
    background: #fff; border-radius: 14px 0 0 0; color: #2b2b2b;
    box-shadow: 0 16px 50px rgba(0, 0, 0, 0.28);
  }
  .page { direction: ltr; }
  .page h2 {
    margin: 0 0 22px; font-size: 30px; line-height: 1.3; font-weight: 700;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  }
  .page p {
    margin: 0 0 18px; width: 600px; font-size: 19px; line-height: 1.8;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  }
  .page:lang(en) h2, .page:lang(en) p, .page:lang(en) { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .selected { background: #b4d5fe; }
  .tooltip {
    position: absolute; left: 738px; top: 316px; width: 520px; padding: 14px 18px;
    background: #fff; color: #202124; border-radius: 8px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.28);
    font-size: 18px; line-height: 1.45;
  }
</style>
<div class="brand"><img src="icons/icon-128.png" alt="">Translator</div>
<div class="text"><h1 data-text="onPageTitle" data-fit="200"></h1><p class="sub" data-text="marqueeSub" data-fit="70"></p></div>
<div class="page" data-article-lang>
  <h2 data-article="heading"></h2>
  <p data-article="marqueeIntro"></p>
  <p><span class="selected" data-article="marqueeSelected"></span></p>
  <p style="margin-top: 150px" data-article="marqueeOutro"></p>
</div>
<div class="tooltip" data-text="marqueeTooltip"></div>
<script src="store.js"></script>
