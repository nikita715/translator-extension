<!DOCTYPE html><meta charset="utf-8"><link rel="stylesheet" href="store.css">
<div class="caption"><h1 data-text="onPageTitle"></h1><p data-text="onPageText"></p></div>
<div class="window"><div class="toolbar"><div class="dots"><i></i><i></i><i></i></div><div class="address" data-article="path"></div><div class="ext">T</div></div><div class="article" data-article-lang><h2 data-article="heading"></h2>
<p data-article="intro"></p>
<p><span class="selected" id="sel" data-article="selected"></span></p>
<p data-article="outro"></p>
</div></div>
<div class="tooltip" id="tip"><div class="languages"></div><span data-text="tooltip"></span></div>
<script src="store.js"></script>
<script>window.addEventListener("load", () => {
  // Place the tooltip under the selection, like contentScript.js does
  let rect = document.getElementById("sel").getClientRects();
  let last = rect[rect.length - 1], first = rect[0];
  let tip = document.getElementById("tip");
  tip.style.left = first.left + "px";
  tip.style.top = (last.bottom + 6) + "px";
});</script>
