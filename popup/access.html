<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Bergamot</title>
  <link rel="stylesheet" href="popup-style.css">
  <style>
    body {
      width: auto;
      padding: 20px;
    }

    p {
      margin: 0 0 16px;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .actions button {
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--control);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .actions #allow {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--on-accent);
    }
  </style>
</head>

<body>
  <p data-i18n="statusBergamotAccess"></p>
  <div class="actions">
    <button id="cancel" type="button" data-i18n="cancel"></button>
    <button id="allow" type="button" data-i18n="allowAccess"></button>
  </div>
  <script src="../engines/languages.js"></script>
  <script src="access.js"></script>
</body>

</html>
